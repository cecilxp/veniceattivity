name: Annunci bar e ristoranti Venezia

on:
  schedule:
    # Ogni due ore (al minuto 7). Il messaggio arriva solo se ci sono annunci nuovi.
    - cron: "7 */2 * * *"
  workflow_dispatch: {}   # permette di lanciarlo a mano dalla scheda "Actions"

permissions:
  contents: write         # serve per salvare seen.json nel repository

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Controlla gli annunci
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva gli annunci già visti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Aggiorna annunci visti"
          git push
